[package]
name = "dice-bot"
version = "0.7.0-coorbin"
authors = ["Lokathor <zefria@gmail.com>"]
repository = "https://github.com/allquixotic/dice-bot-rs"
readme = "README.md"
keywords = ["discord", "dice"]
description = "A discord bot to roll RPG dice rolls."
license = "ZLIB"
publish = false
edition = "2024"
rust-version = "1.88"

[dependencies]
rand = "0.10.3"
regex = "1.13.1"
serenity = { version = "0.12.5", default-features = false, features = ["client", "gateway", "model", "native_tls_backend"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }

[profile.release]
lto = true
codegen-units = 1

[[bin]]
name = "dicebot"
path = "src/main.rs"
